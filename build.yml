name: build-iso
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container: { image: "debian:trixie", options: "--privileged" }
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y sudo && ./build.sh
      - uses: actions/upload-artifact@v4
        with: { name: lumora-iso, path: "lumora-1.0-amd64.iso*" }
